<!DOCTYPE html>
</html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-clifford: #da373d;
      }
    </style>
  </head>
  <body>
    <h1 class="text-3xl font-bold underline">Ростислав Олійник
    </h1>
  </body>
    <div className="flex justify-center items-center min-h-screen bg-gray-100">
      <form className="bg-white p-6 rounded-2xl shadow-lg w-96">
        <h2 className="text-2xl font-semibold text-gray-700 mb-4 text-center">Заповніть форму</h2>
        <div className="mb-4">
          <label className="block text-gray-600 text-sm font-medium mb-1">Ім'я</label>
          <input 
            type="text" 
            className="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            placeholder="Введіть ім'я" 
          />
        </div>
        <div className="mb-4">
          <label className="block text-gray-600 text-sm font-medium mb-1">Email</label>
          <input 
            type="email" 
            className="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            placeholder="Введіть email" 
          />
        </div>
        <button 
          type="submit" 
          className="w-full bg-blue-500 text-white p-2 rounded-lg hover:bg-blue-600 transition duration-200"
        >
        <button class="bg-sky-500 hover:bg-sky-700 ...">надіслати</button>
        </button>
      </form>
    </div>
    </html>
